openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: study-lessons
    description: AI-generated study lessons from topics, text, and scanned pages
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /study-lessons/plan:
    post:
      operationId: planStudyLesson
      summary: Clarify a learner's intent and propose a lesson before generation
      tags: [study]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudyLessonInput"
      responses:
        "200":
          description: A reviewable plan or a focused clarification question
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyLearningPlan"
        "400":
          description: Invalid learner information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Planning failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /study-lessons/generate:
    post:
      operationId: generateStudyLesson
      tags: [study-lessons]
      summary: Generate a study lesson
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudyLessonInput"
      responses:
        "200":
          description: Generated lesson
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyLesson"
        "400":
          description: Invalid lesson request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Lesson generation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /study-lessons/scan-text:
    post:
      operationId: scanStudyText
      tags: [study-lessons]
      summary: Extract study text from a photo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudyTextScanInput"
      responses:
        "200":
          description: Extracted text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyTextScanResult"
        "400":
          description: Invalid image request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Image contains too much text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: No readable text found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Text extraction failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /study-lessons/narrate:
    post:
      operationId: narrateStudyLesson
      tags: [study-lessons]
      summary: Create narration audio for a lesson
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudyLessonNarrationInput"
      responses:
        "200":
          description: Narration audio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyLessonNarration"
        "400":
          description: Invalid narration request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Narration generation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
    StudyLessonInput:
      type: object
      properties:
        learningProfile:
          $ref: "#/components/schemas/StudyLearningProfile"
        clarification:
          type: string
          maxLength: 2000
        confirmedPlan:
          $ref: "#/components/schemas/StudyLearningPlan"
        language:
          $ref: "#/components/schemas/StudyLanguage"
        source:
          type: string
          minLength: 3
          maxLength: 12000
        sourceType:
          type: string
          enum: [topic, text]
        learnerLevel:
          type: string
          enum: [primary, middle, high, college, adult]
        duration:
          type: string
          enum: [short, standard, detailed]
      required: [source, sourceType, learnerLevel, duration]
    StudyLearningProfile:
      type: object
      properties:
        goal:
          type: string
          enum: [foundations, clarify, exam, application]
        knowledge:
          type: string
          enum: [new, some, confident]
        focus:
          type: string
          maxLength: 1500
        known:
          type: string
          maxLength: 1500
      required: [goal, knowledge]
    StudyLearningPlan:
      type: object
      properties:
        interpretations:
          type: array
          minItems: 1
          maxItems: 4
          items:
            type: string
            minLength: 1
            maxLength: 240
        topic:
          type: string
          minLength: 1
          maxLength: 240
        startingPoint:
          type: string
          minLength: 1
          maxLength: 800
        teachingApproach:
          type: string
          minLength: 1
          maxLength: 1000
        objectives:
          type: array
          maxItems: 5
          items:
            type: string
            minLength: 1
            maxLength: 300
        scopeBoundary:
          type: string
          minLength: 1
          maxLength: 800
        needsClarification:
          type: boolean
        clarifyingQuestion:
          type: string
          nullable: true
          maxLength: 700
      required: [interpretations, topic, startingPoint, teachingApproach, objectives, scopeBoundary, needsClarification, clarifyingQuestion]
    StudyLanguage:
      type: string
      enum: [en, hi, mr, es, fr, de]
    StudyTextScanInput:
      type: object
      properties:
        imageBase64:
          type: string
          minLength: 32
          maxLength: 3500000
        mimeType:
          type: string
          enum: [image/jpeg]
      required: [imageBase64, mimeType]
    StudyTextScanResult:
      type: object
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 12000
      required: [text]
    StudyLessonScene:
      type: object
      properties:
        title:
          type: string
        narration:
          type: string
        visualCue:
          type: string
        animation:
          $ref: "#/components/schemas/StudySceneAnimation"
        keyTerm:
          type: ["string", "null"]
        keyTermDefinition:
          type: ["string", "null"]
      required: [title, narration, visualCue, keyTerm, keyTermDefinition]
    StudySceneAnimation:
      type: object
      properties:
        illustration:
          type: string
          enum: [general, water-cycle, plant-growth, fraction, percentage, reaction-water]
          description: Optional specialized educational illustration; general uses the diagram layout.
        fraction:
          $ref: "#/components/schemas/StudyFractionVisual"
        percentage:
          $ref: "#/components/schemas/StudyPercentageVisual"
        teachingSteps:
          type: array
          minItems: 2
          maxItems: 5
          items:
            $ref: "#/components/schemas/StudyTeachingStep"
        layout:
          type: string
          enum: [flow, cycle, orbit, comparison]
        nodes:
          type: array
          minItems: 2
          maxItems: 5
          items:
            type: object
            properties:
              label:
                type: string
                maxLength: 48
              icon:
                type: string
                enum: [sun, water, plant, molecule, planet, person, book, energy, number, cloud, cell, gear, lightbulb, atom, heart]
            required: [label, icon]
        caption:
          type: string
          maxLength: 160
      required: [layout, nodes, caption]
    StudyTeachingStep:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 80
        detail:
          type: string
          minLength: 1
          maxLength: 240
        nodeIndex:
          type: integer
          minimum: 0
          maximum: 4
        narrationCue:
          type: string
          minLength: 1
          maxLength: 160
      required: [title, detail, nodeIndex, narrationCue]
    StudyPercentageVisual:
      type: object
      properties:
        base:
          type: number
          minimum: 0.01
          maximum: 1000000000
        rate:
          type: number
          minimum: 0
          maximum: 100
      required: [base, rate]
    StudyFractionVisual:
      type: object
      properties:
        numerator:
          type: integer
          minimum: 0
          maximum: 12
        denominator:
          type: integer
          minimum: 1
          maximum: 12
      required: [numerator, denominator]
    StudyLesson:
      type: object
      properties:
        learningPlan:
          $ref: "#/components/schemas/StudyLearningPlan"
        learningGuide:
          $ref: "#/components/schemas/StudyLearningGuide"
        language:
          $ref: "#/components/schemas/StudyLanguage"
        title:
          type: string
        overview:
          type: string
        estimatedMinutes:
          type: integer
        keyTakeaways:
          type: array
          items:
            type: string
        scenes:
          type: array
          minItems: 3
          maxItems: 8
          items:
            $ref: "#/components/schemas/StudyLessonScene"
      required: [title, overview, estimatedMinutes, keyTakeaways, scenes]
    StudyLearningGuide:
      type: object
      properties:
        learningObjectives:
          type: array
          minItems: 2
          maxItems: 5
          items:
            type: string
            minLength: 1
            maxLength: 240
        prerequisites:
          type: array
          maxItems: 5
          items:
            type: string
            minLength: 1
            maxLength: 240
        whyItWorks:
          type: array
          minItems: 2
          maxItems: 4
          items:
            type: string
            minLength: 1
            maxLength: 800
        workedExample:
          $ref: "#/components/schemas/StudyWorkedExample"
        misconceptions:
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: "#/components/schemas/StudyMisconception"
        practiceQuestions:
          type: array
          minItems: 2
          maxItems: 4
          items:
            $ref: "#/components/schemas/StudyPracticeQuestion"
      required: [learningObjectives, prerequisites, whyItWorks, workedExample, misconceptions, practiceQuestions]
    StudyWorkedExample:
      type: object
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 1000
        steps:
          type: array
          minItems: 2
          maxItems: 6
          items:
            $ref: "#/components/schemas/StudyWorkedStep"
        answer:
          type: string
          minLength: 1
          maxLength: 1000
      required: [question, steps, answer]
    StudyWorkedStep:
      type: object
      properties:
        action:
          type: string
          minLength: 1
          maxLength: 800
        reason:
          type: string
          minLength: 1
          maxLength: 800
      required: [action, reason]
    StudyMisconception:
      type: object
      properties:
        mistake:
          type: string
          minLength: 1
          maxLength: 600
        correction:
          type: string
          minLength: 1
          maxLength: 1000
      required: [mistake, correction]
    StudyPracticeQuestion:
      type: object
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 1000
        hint:
          type: string
          minLength: 1
          maxLength: 600
        answer:
          type: string
          minLength: 1
          maxLength: 1000
        explanation:
          type: string
          minLength: 1
          maxLength: 1400
      required: [question, hint, answer, explanation]
    StudyLessonNarrationInput:
      type: object
      properties:
        language:
          $ref: "#/components/schemas/StudyLanguage"
        text:
          type: string
          minLength: 1
          maxLength: 12000
      required: [text]
    StudyLessonNarration:
      type: object
      properties:
        audioBase64:
          type: string
        mimeType:
          type: string
      required: [audioBase64, mimeType]

